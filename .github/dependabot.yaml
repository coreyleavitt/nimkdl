version: 2
updates:
  # Keep GitHub Actions versions current (uses: actions/checkout@v4 etc.).
  # Nim/Nimble + the Rust crates in benchmarks/comparisons/ are not
  # ecosystems Dependabot supports; manual bumps for those.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
