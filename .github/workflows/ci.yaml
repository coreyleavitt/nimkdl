name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    steps:
      - uses: actions/checkout@v4
      - name: nimble test
        run: nimble -y test
      - name: perfGuard (no KdlNode deep-copy)
        run: nimble -y perfGuard
