name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.0
    steps:
      - uses: actions/checkout@v7
      - name: trust workdir for git (container uid mismatch w/ runner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build nim docs
        run: |
          # --project crawls the whole module graph from the entry point.
          # --index:on emits a searchable theindex.html. Git options seed
          # "View source" links so doc pages link back to GitHub blob view.
          nim doc \
            --project \
            --index:on \
            --git.url:https://github.com/coreyleavitt/nkdl \
            --git.commit:${{ github.sha }} \
            --outdir:_docs \
            src/nkdl.nim
          # Land at the umbrella module by default.
          cp _docs/nkdl.html _docs/index.html || true
      - name: run conformance + emit live badge JSON
        run: |
          # Capture the conformance line from the real test output.
          # Output shape (from tests/test_conformance.nim):
          #   conformance: 338 pass, 0 fail, 0 skip (of 338 cases)
          nim c -r --hints:off tests/test_conformance.nim 2>&1 \
            | tee conf.out
          LINE=$(grep -E "^[[:space:]]*conformance: [0-9]+ pass" conf.out | head -1)
          if [ -z "$LINE" ]; then
            echo "::error::could not parse conformance output"
            exit 1
          fi
          PASS=$(echo "$LINE" | grep -oE "[0-9]+ pass" | grep -oE "[0-9]+")
          FAIL=$(echo "$LINE" | grep -oE "[0-9]+ fail" | grep -oE "[0-9]+")
          TOTAL=$(echo "$LINE" | grep -oE "of [0-9]+ cases" | grep -oE "[0-9]+")
          # Color picks badge tone honestly: full green only at 100%.
          if [ "$FAIL" = "0" ] && [ "$PASS" = "$TOTAL" ]; then
            COLOR="brightgreen"
          elif [ "$FAIL" = "0" ]; then
            COLOR="green"
          else
            COLOR="red"
          fi
          mkdir -p _docs
          printf '{"schemaVersion":1,"label":"conformance","message":"%s/%s","color":"%s"}\n' \
            "$PASS" "$TOTAL" "$COLOR" > _docs/conformance-badge.json
          echo "badge: $PASS/$TOTAL ($COLOR)"
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
