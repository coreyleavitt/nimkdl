    .subtitle { fill: #94a3b8; font-size: 12px; }
    .note { fill: #94a3b8; font-size: 11px; font-style: italic; }
    .bar-ours  { fill: #14b8a6; }
    .bar-ckdl  { fill: #f59e0b; }
    .bar-knus  { fill: #a78bfa; }
    .bar-rs    { fill: #64748b; }
    .grid { stroke: #1e293b; stroke-width: 1; }
