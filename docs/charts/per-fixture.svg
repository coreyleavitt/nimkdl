  <rect width="880" height="760" fill="#0b1220"/>

  <text x="40" y="32" class="title">parse throughput, all fixtures, all parsers</text>
  <text x="40" y="50" class="subtitle">bars normalized to the row leader (whichever parser wins that row)</text>
  <text x="40" y="68" class="note">apples-to-ish-apples: ckdl drains events (no AST), the others build their library's default representation. see BENCHMARK.md.</text>

  <rect x="430" y="20" width="14" height="14" class="bar-ours"/>
