<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <style>
    .axis { fill: #94a3b8; font-size: 12px; }
    .label { fill: #cbd5e1; font-size: 13px; font-weight: 500; }
    .sublabel { fill: #94a3b8; font-size: 11px; }
    .value { fill: #f1f5f9; font-size: 11px; font-family: ui-monospace, monospace; }
    .title { fill: #f1f5f9; font-size: 16px; font-weight: 600; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .bar-ours { fill: #14b8a6; }
    .bar-rs { fill: #475569; }
    .bar-gm { fill: #334155; }
    .grid { stroke: #1e293b; stroke-width: 1; }
    .legend { font-size: 12px; }
  </style>
  <rect width="800" height="480" fill="#0b1220"/>

  <text x="40" y="32" class="title">per-fixture comparison</text>
  <text x="40" y="50" class="subtitle">throughput shown as percentage of nimkdl (always 100%)</text>

  <rect x="540" y="20" width="14" height="14" class="bar-ours"/>
  <text x="558" y="32" class="legend" fill="#cbd5e1">nimkdl</text>
  <rect x="620" y="20" width="14" height="14" class="bar-rs"/>
  <text x="638" y="32" class="legend" fill="#cbd5e1">kdl-rs</text>
  <rect x="700" y="20" width="14" height="14" class="bar-gm"/>
  <text x="718" y="32" class="legend" fill="#cbd5e1">greenm01</text>

  <line x1="240" y1="80"  x2="240" y2="420" class="grid"/>
  <line x1="370" y1="80"  x2="370" y2="420" class="grid"/>
  <line x1="500" y1="80"  x2="500" y2="420" class="grid"/>
  <line x1="630" y1="80"  x2="630" y2="420" class="grid"/>
  <line x1="760" y1="80"  x2="760" y2="420" class="grid"/>
  <line x1="240" y1="420" x2="760" y2="420" class="grid"/>

  <text x="240" y="442" class="axis" text-anchor="middle">0</text>
  <text x="370" y="442" class="axis" text-anchor="middle">25%</text>
  <text x="500" y="442" class="axis" text-anchor="middle">50%</text>
  <text x="630" y="442" class="axis" text-anchor="middle">75%</text>
  <text x="760" y="442" class="axis" text-anchor="middle">100%</text>
  <text x="500" y="460" class="axis" text-anchor="middle">throughput vs nimkdl</text>

  <text x="230" y="100" class="label" text-anchor="end">realistic-config.kdl</text>
  <text x="230" y="113" class="sublabel" text-anchor="end">5.6KB, language-dense</text>
  <rect x="240" y="86"  width="520" height="11" class="bar-ours"/>
  <rect x="240" y="100" width="32"  height="11" class="bar-rs"/>
  <rect x="240" y="114" width="34"  height="11" class="bar-gm"/>

  <text x="230" y="180" class="label" text-anchor="end">ci.kdl</text>
  <text x="230" y="193" class="sublabel" text-anchor="end">1KB, mixed</text>
  <rect x="240" y="166" width="520" height="11" class="bar-ours"/>
  <rect x="240" y="180" width="35"  height="11" class="bar-rs"/>
  <rect x="240" y="194" width="26"  height="11" class="bar-gm"/>

  <text x="230" y="260" class="label" text-anchor="end">website.kdl</text>
  <text x="230" y="273" class="sublabel" text-anchor="end">2KB, HTML-ish</text>
  <rect x="240" y="246" width="520" height="11" class="bar-ours"/>
  <rect x="240" y="260" width="34"  height="11" class="bar-rs"/>
  <rect x="240" y="274" width="31"  height="11" class="bar-gm"/>

  <text x="230" y="340" class="label" text-anchor="end">unicode-heavy.kdl</text>
  <text x="230" y="353" class="sublabel" text-anchor="end">1KB, multi-script</text>
  <rect x="240" y="326" width="520" height="11" class="bar-ours"/>
  <rect x="240" y="340" width="53"  height="11" class="bar-rs"/>
  <text x="245" y="362" class="value" fill="#f87171">FAIL (greenm01 rejects valid v2 idents)</text>

  <text x="230" y="400" class="label" text-anchor="end">Cargo.kdl</text>
  <text x="230" y="413" class="sublabel" text-anchor="end">238B, strings-only</text>
  <rect x="240" y="386" width="520" height="11" class="bar-ours"/>
  <rect x="240" y="400" width="46"  height="11" class="bar-rs"/>
  <rect x="240" y="414" width="43"  height="11" class="bar-gm"/>
</svg>
