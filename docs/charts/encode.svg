<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <style>
    .axis { fill: #94a3b8; font-size: 12px; }
    .label { fill: #cbd5e1; font-size: 13px; font-weight: 500; }
    .sublabel { fill: #94a3b8; font-size: 11px; }
    .value { fill: #f1f5f9; font-size: 11px; font-family: ui-monospace, monospace; }
    .title { fill: #f1f5f9; font-size: 16px; font-weight: 600; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .section { fill: #f1f5f9; font-size: 13px; font-weight: 600; }
    .sectiondetail { fill: #94a3b8; font-size: 11px; }
    .bar-ours  { fill: #14b8a6; }
    .bar-rs    { fill: #64748b; }
    .bar-facet { fill: #f472b6; }
    .grid { stroke: #1e293b; stroke-width: 1; }
    .divider { stroke: #1e293b; stroke-width: 1; }
  </style>
  <rect width="820" height="540" fill="#0b1220"/>

  <text x="40" y="32" class="title">encode throughput (cross-implementation)</text>
  <text x="40" y="50" class="subtitle">bars normalized within each section since modes differ in scale</text>

  <line x1="40" y1="78" x2="780" y2="78" class="divider"/>

  <!-- Section 1: preserve mode -->
  <text x="40" y="100" class="section">preserve mode</text>
  <text x="40" y="116" class="sectiondetail">round-trip with format preservation, AST → string. realistic-config.kdl (5.6KB).</text>

  <text x="300" y="142" class="label" text-anchor="end">nimkdl emPreserve</text>
  <text x="300" y="155" class="sublabel" text-anchor="end">returns sourceText (memcpy)</text>
  <rect x="310" y="130" width="450" height="22" class="bar-ours"/>
  <text x="765" y="146" class="value">23.4M ops/s</text>

  <text x="300" y="182" class="label" text-anchor="end">kdl-rs to_string</text>
  <text x="300" y="195" class="sublabel" text-anchor="end">walks AST, emits per-token trivia</text>
  <rect x="310" y="170" width="3" height="22" class="bar-rs"/>
  <text x="320" y="186" class="value">117K ops/s  (~200x slower)</text>

  <text x="40" y="218" class="sectiondetail">different strategies. ours caches the source string and returns it; kdl-rs walks per-token trivia stored on the AST. both lossless, both correct.</text>

  <line x1="40" y1="240" x2="780" y2="240" class="divider"/>

  <!-- Section 2: canonical AST -> string -->
  <text x="40" y="262" class="section">canonical mode</text>
  <text x="40" y="278" class="sectiondetail">regenerate from AST, no preservation. realistic-config.kdl (5.6KB).</text>

  <text x="300" y="304" class="label" text-anchor="end">nimkdl emPretty</text>
  <text x="300" y="317" class="sublabel" text-anchor="end">multi-line, indented</text>
  <rect x="310" y="292" width="450" height="22" class="bar-ours"/>
  <text x="765" y="308" class="value">56.8K ops/s</text>

  <text x="300" y="344" class="label" text-anchor="end">kdl-rs autoformat + to_string</text>
  <text x="300" y="357" class="sublabel" text-anchor="end">canonicalize, then emit</text>
  <rect x="310" y="332" width="139" height="22" class="bar-rs"/>
  <text x="457" y="348" class="value">17.6K ops/s  (3.2x slower)</text>

  <line x1="40" y1="380" x2="780" y2="380" class="divider"/>

  <!-- Section 3: typed value -> string -->
  <text x="40" y="402" class="section">typed value → string</text>
  <text x="40" y="418" class="sectiondetail">serialize a typed structure back to KDL. homogeneous-services-100.kdl (~5KB, 100 Service nodes).</text>

  <text x="300" y="444" class="label" text-anchor="end">facet-kdl to_string</text>
  <text x="300" y="457" class="sublabel" text-anchor="end">direct from typed value</text>
  <rect x="310" y="432" width="450" height="22" class="bar-facet"/>
  <text x="765" y="448" class="value">27.5K ops/s</text>

  <text x="300" y="484" class="label" text-anchor="end">nimkdl encode(seq[Service])</text>
  <text x="300" y="497" class="sublabel" text-anchor="end">via KdlDoc intermediate (issue #1)</text>
  <rect x="310" y="472" width="293" height="22" class="bar-ours"/>
  <text x="610" y="488" class="value">17.9K ops/s  (1.5x slower)</text>
</svg>
