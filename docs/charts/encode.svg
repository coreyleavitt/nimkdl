<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <style>
    .axis { fill: #94a3b8; font-size: 13px; }
    .label { fill: #cbd5e1; font-size: 14px; font-weight: 500; }
    .sublabel { fill: #94a3b8; font-size: 11px; }
    .value { fill: #f1f5f9; font-size: 13px; font-family: ui-monospace, monospace; }
    .title { fill: #f1f5f9; font-size: 16px; font-weight: 600; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .bar-preserve { fill: #22d3ee; }   /* cyan, emPreserve fast-path */
    .bar-pretty   { fill: #14b8a6; }   /* teal, canonical pretty */
    .bar-compact  { fill: #0d9488; }   /* darker teal, canonical compact */
    .grid { stroke: #1e293b; stroke-width: 1; }
  </style>
  <rect width="760" height="320" fill="#0b1220"/>

  <text x="40" y="32" class="title">encode throughput, three modes</text>
  <text x="40" y="50" class="subtitle">realistic-config.kdl (5.6KB), nimkdl only — cross-impl encode comparison pending</text>

  <line x1="200" y1="80"  x2="200" y2="270" class="grid"/>
  <line x1="320" y1="80"  x2="320" y2="270" class="grid"/>
  <line x1="440" y1="80"  x2="440" y2="270" class="grid"/>
  <line x1="560" y1="80"  x2="560" y2="270" class="grid"/>
  <line x1="680" y1="80"  x2="680" y2="270" class="grid"/>
  <line x1="200" y1="270" x2="700" y2="270" class="grid"/>

  <text x="200" y="292" class="axis" text-anchor="middle">0</text>
  <text x="320" y="292" class="axis" text-anchor="middle">25</text>
  <text x="440" y="292" class="axis" text-anchor="middle">50</text>
  <text x="560" y="292" class="axis" text-anchor="middle">75</text>
  <text x="680" y="292" class="axis" text-anchor="middle">100</text>
  <text x="440" y="310" class="axis" text-anchor="middle">throughput (K ops/s) — note: emPreserve is on a different scale</text>

  <text x="190" y="113" class="label" text-anchor="end">emPreserve</text>
  <text x="190" y="129" class="sublabel" text-anchor="end">byte-lossless, returns sourceText</text>
  <rect x="200" y="96"  width="490" height="32" class="bar-preserve"/>
  <text x="500" y="118" class="value" fill="#0b1220" font-weight="600">16,700K ops/s  (off-scale)</text>

  <text x="190" y="173" class="label" text-anchor="end">emPretty</text>
  <text x="190" y="189" class="sublabel" text-anchor="end">canonical, indented multi-line</text>
  <rect x="200" y="156" width="223" height="32" class="bar-pretty"/>
  <text x="431" y="178" class="value">46.5K ops/s</text>

  <text x="190" y="233" class="label" text-anchor="end">emCompact</text>
  <text x="190" y="249" class="sublabel" text-anchor="end">canonical, single-line, ;-separated</text>
  <rect x="200" y="216" width="230" height="32" class="bar-compact"/>
  <text x="438" y="238" class="value">47.9K ops/s</text>
</svg>
