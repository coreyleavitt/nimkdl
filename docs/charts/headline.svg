<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <style>
    .axis { fill: #94a3b8; font-size: 13px; }
    .label { fill: #cbd5e1; font-size: 14px; font-weight: 500; }
    .sublabel { fill: #94a3b8; font-size: 11px; }
    .value { fill: #f1f5f9; font-size: 13px; font-family: ui-monospace, monospace; }
    .title { fill: #f1f5f9; font-size: 16px; font-weight: 600; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .bar-ours  { fill: #14b8a6; }   /* nimkdl teal */
    .bar-ckdl  { fill: #f59e0b; }   /* ckdl amber */
    .bar-knus  { fill: #a78bfa; }   /* knus violet */
    .bar-facet { fill: #f472b6; }   /* facet-kdl pink */
    .bar-rs    { fill: #64748b; }   /* kdl-rs slate */
    .grid { stroke: #1e293b; stroke-width: 1; }
  </style>
  <rect width="760" height="380" fill="#0b1220"/>

  <text x="40" y="32" class="title">realistic-config.kdl (5.6KB)</text>
  <text x="40" y="50" class="subtitle">parses per second, same container, release+LTO equivalent. Source: benchmarks/comparisons/last-run.txt</text>

  <!-- axis 0..25K across x=180..680, 1K = 20px -->
  <line x1="180" y1="80"  x2="180" y2="320" class="grid"/>
  <line x1="280" y1="80"  x2="280" y2="320" class="grid"/>
  <line x1="380" y1="80"  x2="380" y2="320" class="grid"/>
  <line x1="480" y1="80"  x2="480" y2="320" class="grid"/>
  <line x1="580" y1="80"  x2="580" y2="320" class="grid"/>
  <line x1="680" y1="80"  x2="680" y2="320" class="grid"/>
  <line x1="180" y1="320" x2="700" y2="320" class="grid"/>

  <text x="180" y="342" class="axis" text-anchor="middle">0</text>
  <text x="280" y="342" class="axis" text-anchor="middle">5K</text>
  <text x="380" y="342" class="axis" text-anchor="middle">10K</text>
  <text x="480" y="342" class="axis" text-anchor="middle">15K</text>
  <text x="580" y="342" class="axis" text-anchor="middle">20K</text>
  <text x="680" y="342" class="axis" text-anchor="middle">25K ops/s</text>

  <!-- nimkdl 23.9K -> 478 -->
  <text x="170" y="103" class="label" text-anchor="end">nimkdl</text>
  <text x="170" y="119" class="sublabel" text-anchor="end">Nim, hand-written AST</text>
  <rect x="180" y="86"  width="478" height="32" class="bar-ours"/>
  <text x="668" y="108" class="value">23,900</text>

  <!-- ckdl 15.4K -> 308 -->
  <text x="170" y="153" class="label" text-anchor="end">ckdl</text>
  <text x="170" y="169" class="sublabel" text-anchor="end">C, event-drain (no AST)</text>
  <rect x="180" y="136" width="308" height="32" class="bar-ckdl"/>
  <text x="496" y="158" class="value">15,400</text>

  <!-- knus parse_ast 2.6K -> 52 -->
  <text x="170" y="203" class="label" text-anchor="end">knus</text>
  <text x="170" y="219" class="sublabel" text-anchor="end">Rust, parse_ast</text>
  <rect x="180" y="186" width="52" height="32" class="bar-knus"/>
  <text x="240" y="208" class="value">2,600</text>

  <!-- facet-kdl ~0.9K -> 18 -->
  <text x="170" y="253" class="label" text-anchor="end">facet-kdl</text>
  <text x="170" y="269" class="sublabel" text-anchor="end">Rust, typed via facet (decode only)</text>
  <rect x="180" y="236" width="18" height="32" class="bar-facet"/>
  <text x="206" y="258" class="value">900</text>

  <!-- kdl-rs 1.2K -> 24 -->
  <text x="170" y="303" class="label" text-anchor="end">kdl-rs</text>
  <text x="170" y="319" class="sublabel" text-anchor="end">Rust, canonical AST</text>
  <rect x="180" y="286" width="24" height="32" class="bar-rs"/>
  <text x="212" y="308" class="value">1,200</text>
</svg>
